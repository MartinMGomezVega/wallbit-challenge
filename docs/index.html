<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallbit Contabilidad · API Docs</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; background: #f8fafc; }
      .topbar-wallbit {
        background: #120477;
        color: #fff;
        padding: 12px 24px;
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .topbar-wallbit span.badge {
        background: #7c73f9;
        color: #fff;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body>
    <div class="topbar-wallbit">
      <span>Wallbit Contabilidad · API v1</span>
      <span class="badge">OpenAPI 3.0</span>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      const specUrl = window.location.pathname.startsWith('/docs')
        ? '/api/openapi.yaml'
        : './openapi.yaml';
      window.ui = SwaggerUIBundle({
        url: specUrl,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
      });
    </script>
  </body>
</html>
