<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallbit Contabilidad — API</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; }
      #load-error {
        display: none;
        font-family: sans-serif;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <p id="load-error">
      No se pudo cargar Swagger UI. Verificá la conexión a internet y que el navegador
      no esté bloqueando scripts externos. La especificación está en
      <code>backend/api/openapi.yaml</code>.
    </p>
    <script>
      var IS_LOCAL = location.pathname.indexOf('/docs') === 0;
      var SPEC_URL = IS_LOCAL ? '/api/openapi.yaml' : 'openapi.yaml';
      var BUNDLE_URLS = [
        'https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js',
        'https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js',
      ];
      function startSwagger() {
        var options = {
          url: SPEC_URL,
          dom_id: '#swagger-ui',
          deepLinking: true,
          docExpansion: 'list',
          defaultModelsExpandDepth: 1,
        };
        // En GitHub Pages la página es solo documentación: la API corre en la máquina
        // de quien la prueba, así que se deshabilita "Try it out". En local (/docs)
        // queda habilitado contra la misma API.
        if (!IS_LOCAL) options.supportedSubmitMethods = [];
        window.ui = SwaggerUIBundle(options);
      }
      function loadBundle(index) {
        if (index >= BUNDLE_URLS.length) {
          document.getElementById('load-error').style.display = 'block';
          return;
        }
        var script = document.createElement('script');
        script.src = BUNDLE_URLS[index];
        script.onload = startSwagger;
        script.onerror = function () { loadBundle(index + 1); };
        document.body.appendChild(script);
      }
      loadBundle(0);
    </script>
  </body>
</html>
