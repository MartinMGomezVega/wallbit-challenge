services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallbit}
      POSTGRES_DB: ${POSTGRES_DB:-accountant}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallbit -d accountant"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://wallbit:wallbit@db:5432/accountant?sslmode=disable
      APP_NOW: "2026-11-05T09:00:00-03:00"
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata: {}

