openapi: 3.0.3
info:
  title: Wallbit Contabilidad API
  version: 1.0.0
  description: >-
    API REST para la gestión de cierres impositivos mensuales (Monotributo y
    Responsable Inscripto). Diseño REST por recursos bajo /v1. La autorización la
    define la identidad provista en el header X-Demo-User (accountant accede a
    todo; client:<clientId> únicamente a sus propios recursos).
servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo
tags:
  - name: Períodos
    description: Períodos mensuales, corridas y estadísticas
  - name: Cierres
    description: Cierres impositivos mensuales y detalle
  - name: Aprobaciones
    description: Aprobación individual y en lote de cierres
  - name: Clientes
    description: Perfil de cliente, régimen impositivo y cierres asociados
  - name: Facturas
    description: Facturas emitidas, de compras, importación y confirmación
  - name: Movimientos
    description: Movimientos bancarios y reclasificación
  - name: Parámetros
    description: Parámetros de negocio configurables por el contador
  - name: Notificaciones
    description: Notificaciones al cliente y confirmación de lectura
  - name: Sistema
    description: Salud del servicio, catálogo de señales y tareas del sistema
components:
  securitySchemes:
    DemoUserHeader:
      type: apiKey
      in: header
      name: X-Demo-User
      description: Identidad de demo (`accountant` o `client:<clientId>`).
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Monto en centavos
          example: 12500000
        currency:
          type: string
          enum: [ARS, USD]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    PeriodStats:
      type: object
      properties:
        period:
          type: string
          example: "2026-10"
        progress:
          type: object
          properties:
            total: { type: integer }
            byStatus:
              type: object
              additionalProperties: { type: integer }
            approvedPct: { type: integer, description: BasisPoints }
            pendingReview:
              type: object
              additionalProperties: { type: integer }
            estimatedReviewMinutes: { type: integer }
        totals:
          type: object
          properties:
            billedUSD: { $ref: '#/components/schemas/Money' }
            billedARS: { $ref: '#/components/schemas/Money' }
            toPayARS: { $ref: '#/components/schemas/Money' }
            toPayByDueDate:
              type: array
              items:
                type: object
                properties:
                  date: { type: string }
                  amount: { $ref: '#/components/schemas/Money' }
                  clients: { type: integer }
        risk:
          type: object
          properties:
            bySeverity:
              type: object
              additionalProperties: { type: integer }
            bySignal:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  label: { type: string }
                  severity: { type: string }
                  count: { type: integer }
            byCategory:
              type: array
              items:
                type: object
                properties:
                  category: { type: string }
                  clients: { type: integer }
            nearKCap: { type: integer }
        success:
          type: object
          properties:
            greenPct: { type: integer, description: BasisPoints }
            greenCount: { type: integer }
            total: { type: integer }
            notifiedBeforeDay10Pct: { type: integer, description: BasisPoints }
            notifiedBeforeDay10Count: { type: integer }
            notifiedCount: { type: integer }
            paidOnTimePct: { type: integer, description: BasisPoints }
            paidOnTimeCount: { type: integer }
    ImportResult:
      type: object
      properties:
        imported: { type: integer }
        duplicates: { type: integer }
        warnings:
          type: array
          items: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              message: { type: string }
    Invoice:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        type: { type: string, enum: [A, B, C, E] }
        pointOfSale: { type: integer }
        number: { type: integer }
        issueDate: { type: string }
        currency: { type: string, enum: [ARS, USD] }
        netAmount: { $ref: '#/components/schemas/Money' }
        vatAmount: { $ref: '#/components/schemas/Money' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        receiverName: { type: string }
        receiverDoc: { type: string }
        source: { type: string, enum: [CSV, MANUAL, SEED] }
        uploadedBy:
          type: string
          enum: [CLIENT, ACCOUNTANT, SEED]
          description: Actor que cargó la factura en el sistema
        createdAt: { type: string }
    ClientInput:
      type: object
      properties:
        clientId: { type: string }
        period: { type: string }
        declaredNoExternalIncome: { type: boolean }
        externalIncome:
          type: array
          items:
            type: object
            properties:
              amount: { $ref: '#/components/schemas/Money' }
              description: { type: string }
        confirmedAt: { type: string }
        confirmedBy:
          type: string
          enum: [CLIENT, ACCOUNTANT, SEED]
          description: Actor que confirmó el período
        confirmationNote:
          type: string
          description: Evidencia o justificación de la confirmación por el contador
        updatedAt: { type: string }
    ValidatedBy:
      type: object
      required: [name, license]
      properties:
        name:
          type: string
        license:
          type: string
    PublishedFigureItem:
      type: object
      required: [concept, amount, dueDate]
      properties:
        concept:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        dueDate:
          type: string
          format: date-time
    PublishedFigures:
      type: object
      required: [billedUSD, billedARS, items, total]
      properties:
        billedUSD:
          $ref: '#/components/schemas/Money'
        billedARS:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublishedFigureItem'
        total:
          $ref: '#/components/schemas/Money'
    Published:
      type: object
      required: [version, title, body, figures, publishedAt]
      properties:
        version:
          type: integer
        title:
          type: string
        body:
          type: string
        figures:
          $ref: '#/components/schemas/PublishedFigures'
        publishedAt:
          type: string
          format: date-time
        validatedBy:
          $ref: '#/components/schemas/ValidatedBy'
        regime:
          type: string
        category:
          type: string
        pctOfCategoryCapBp:
          type: integer
        categoryCapARS:
          $ref: '#/components/schemas/Money'
        billed12mARS:
          $ref: '#/components/schemas/Money'
    ClientClosing:
      type: object
      required: [closingId, period, state]
      properties:
        closingId:
          type: string
        period:
          type: string
        state:
          type: string
          enum: [ACTION_REQUIRED, IN_REVIEW, READY]
        paidAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        published:
          $ref: '#/components/schemas/Published'
        clientInputSummary:
          type: object
          properties:
            invoicesCount:
              type: integer
            externalIncomeCount:
              type: integer
            externalIncomeDeclared:
              type: boolean
paths:
  /health:
    get:
      summary: Healthcheck
      tags: [Sistema]
      responses:
        '200':
          description: Servicio operativo
  /v1/openapi.yaml:
    get:
      summary: Especificación OpenAPI 3.0 en formato YAML
      tags: [Sistema]
      responses:
        '200':
          description: Especificación OpenAPI
  /v1/signal-types:
    get:
      summary: Catálogo de señales impositivas
      tags: [Sistema]
      security: [{ DemoUserHeader: [] }]
      responses:
        '200':
          description: Catálogo de señales
        '401':
          description: No autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/parameters:
    get:
      summary: Obtiene parámetros globales del estudio
      tags: [Parámetros]
      security: [{ DemoUserHeader: [] }]
      responses:
        '200':
          description: Parámetros vigentes
    put:
      summary: Actualiza parámetros globales del estudio y recalcula cierres
      tags: [Parámetros]
      security: [{ DemoUserHeader: [] }]
      responses:
        '200':
          description: Parámetros actualizados
        '422':
          description: Error de validación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/periods:
    get:
      summary: Lista los períodos con cierres disponibles
      tags: [Períodos]
      security: [{ DemoUserHeader: [] }]
      responses:
        '200':
          description: Períodos disponibles ordenados de más reciente a más antiguo
          content:
            application/json:
              schema:
                type: object
                required: [periods]
                properties:
                  periods:
                    type: array
                    items:
                      type: string
                      example: "2026-10"
  /v1/periods/{period}/closing-runs:
    post:
      summary: Ejecuta el cálculo masivo de cierres para un período
      tags: [Períodos]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string, example: "2026-04" }
      responses:
        '201':
          description: Resultado de la ejecución
          headers:
            Location:
              schema: { type: string }
              description: URI del listado de cierres del período
  /v1/periods/{period}/closings:
    get:
      summary: Lista paginada, filtrada y ordenada de cierres del período
      tags: [Períodos]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [severity, name, regime, billed, pctKCap, toPay, status]
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Página de cierres
  /v1/periods/{period}/closings/ids:
    get:
      summary: Lista ordenada de IDs de cierres según filtros aplicados
      tags: [Períodos]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [severity, name, regime, billed, pctKCap, toPay, status]
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Lista de IDs de cierres
          content:
            application/json:
              schema:
                type: object
                required: [ids]
                properties:
                  ids:
                    type: array
                    items: { type: string }
  /v1/periods/{period}/closings/summary:
    get:
      summary: Resumen numérico del período para chips de filtro
      tags: [Períodos]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Conteos por severidad y por señal
  /v1/periods/{period}/stats:
    get:
      summary: Métricas consolidadas del período para la pestaña Resumen
      tags: [Períodos]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estadísticas del período
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodStats' }
        '400':
          description: Período inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: No autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/closings/{closingId}:
    get:
      summary: Detalle atómico de un cierre mensual
      tags: [Cierres]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: closingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detalle del cierre
  /v1/closings/{closingId}/approvals:
    post:
      summary: Aprueba individualmente un cierre mensual
      tags: [Aprobaciones]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: closingId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                clientNote: { type: string }
      responses:
        '201':
          description: Cierre aprobado exitosamente
          headers:
            Location:
              schema: { type: string }
              description: URI del cierre aprobado
        '409':
          description: Conflicto de versión concurrente
  /v1/periods/{period}/approvals:
    post:
      summary: Aprueba en lote cierres verdes del período
      tags: [Aprobaciones]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [closings]
              properties:
                closings:
                  type: array
                  items:
                    type: object
                    required: [id, version]
                    properties:
                      id: { type: string }
                      version: { type: integer }
      responses:
        '200':
          description: Resultado de la aprobación en lote por ítem
  /v1/reminder-runs:
    post:
      summary: Dispara manualmente el envío de recordatorios de pago
      tags: [Sistema]
      security: [{ DemoUserHeader: [] }]
      responses:
        '201':
          description: Recordatorios procesados
  /v1/movements/{movementId}/classification:
    put:
      summary: Reclasifica un movimiento bancario
      tags: [Movimientos]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: movementId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Clasificación actualizada
  /v1/clients/{clientId}/invoices:
    get:
      summary: Lista las facturas de venta de un cliente
      tags: [Facturas]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
        - name: period
          in: query
          required: false
          schema: { type: string, example: "2026-10" }
      responses:
        '200':
          description: Facturas del cliente
    post:
      summary: Carga manual de una factura de venta
      tags: [Facturas]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Factura creada
          headers:
            Location:
              schema: { type: string }
              description: URI de la factura creada
  /v1/clients/{clientId}/invoice-imports:
    post:
      summary: Importa facturas de venta desde CSV
      tags: [Facturas]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Resultado de importación
          headers:
            Location:
              schema: { type: string }
              description: URI del listado de facturas del cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '403':
          description: Rol no autorizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Error de validación del CSV
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/clients/{clientId}/purchase-invoices:
    post:
      summary: Carga manual de una factura de compra (RI)
      tags: [Facturas]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Factura de compra creada
          headers:
            Location:
              schema: { type: string }
              description: URI de la factura de compra creada
  /v1/clients/{clientId}/periods/{period}/external-income:
    put:
      summary: Declara ingresos fuera de Wallbit o declara no tenerlos
      tags: [Facturas]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
        - name: period
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Declaración guardada
  /v1/clients/{clientId}/periods/{period}/confirmation:
    post:
      summary: Confirma la carga mensual del cliente (o por el contador en su nombre)
      tags: [Facturas]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
        - name: period
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                externalIncome:
                  type: object
                  properties:
                    none: { type: boolean }
                    items:
                      type: array
                      items:
                        type: object
                        required: [amount, description]
                        properties:
                          amount: { $ref: '#/components/schemas/Money' }
                          description: { type: string }
                note:
                  type: string
                  minLength: 1
                  maxLength: 300
                  example: "Me lo confirmó por mail el 06/11"
      responses:
        '201':
          description: Período confirmado exitosamente
          headers:
            Location:
              schema: { type: string }
              description: URI de los cierres del cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientInput' }
        '403':
          description: Rol no autorizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Cliente o cierre no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Período ya confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Nota requerida o datos inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/clients/{clientId}/regime-changes:
    post:
      summary: Cambia el régimen impositivo de un cliente (Monotributo ↔ RI)
      tags: [Clientes]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Régimen actualizado
          headers:
            Location:
              schema: { type: string }
              description: URI del cliente
  /v1/clients/{clientId}/ri-profile:
    put:
      summary: Actualiza el perfil de Responsable Inscripto del cliente
      tags: [Clientes]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Perfil RI actualizado
  /v1/clients/{clientId}:
    get:
      summary: Perfil del cliente
      tags: [Clientes]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Datos del cliente
  /v1/clients/{clientId}/closings:
    get:
      summary: Lista los cierres publicados/pagados del cliente
      tags: [Clientes]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cierres del cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientClosing'
  /v1/closings/{closingId}/payment:
    put:
      summary: Marca un cierre publicado como pagado
      tags: [Cierres]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: closingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cierre marcado como pagado
  /v1/clients/{clientId}/notifications:
    get:
      summary: Lista las notificaciones del cliente
      tags: [Notificaciones]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Notificaciones del cliente
  /v1/clients/{clientId}/notifications/{notificationId}:
    patch:
      summary: Marca una notificación como leída
      tags: [Notificaciones]
      security: [{ DemoUserHeader: [] }]
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read: { type: boolean, example: true }
      responses:
        '200':
          description: Notificación marcada como leída
